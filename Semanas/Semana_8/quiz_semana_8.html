<script>window.QUIZ = {"tema": "Exploring a report", "cierre": "A total can hide the real story. Go one level down before you decide.", "preguntas": [{"q": "The Netherlands has £284,662 in net sales. What do you find when you drill down?", "o": ["95 customers, evenly spread", "One customer brings 98.2% of the sales", "No identified customers", "Sales only in November"], "a": 1, "e": "Customer 14646 brings £279,489 of the total."}, {"q": "What is the difference between drill mode and drillthrough?", "o": ["They are the same", "Drill stays in the same visual; drillthrough goes to another filtered page", "Drillthrough only works in Excel", "Drill deletes data"], "a": 1, "e": "This is how Microsoft Learn separates them."}, {"q": "By default, what happens when you select a data point in a Power BI visual?", "o": ["Nothing changes", "The report closes", "Other visuals cross-filter or cross-highlight", "The data is refreshed"], "a": 2, "e": "The default is to cross-filter and cross-highlight. You can change it with Edit interactions."}, {"q": "At which three levels can you set filters in the Filters pane?", "o": ["Row, column and cell", "Visual, page and report", "Query, model and table", "User, group and tenant"], "a": 1, "e": "Microsoft Learn lists the visual, page and report levels."}, {"q": "During a usability test, your colleague asks where to click. What should you say?", "o": ["Show them right away", "Take the computer back", "“What would you do?”", "End the test"], "a": 2, "e": "You want to see where the design fails, so observe without helping."}, {"q": "On November 14, a single invoice with no customer brings £50,654. What can you conclude?", "o": ["It is a fraud", "It is one huge customer", "The data does not explain it, so you need to ask", "It is an error and should be deleted"], "a": 2, "e": "The data shows the fact, not the cause. It tells you what to ask next."}], "sesion": 8};</script>
