<script>window.QUIZ = {"tema": "Defending your project", "cierre": "If you cannot defend a part of the chain, that part is not finished.", "preguntas": [{"q": "What is the order of the chain in Project 1?", "o": ["Dashboard, KPI, data, problem", "Problem, data, model, KPI, dashboard, decision", "Model, decision, data, problem", "KPI, problem, dashboard, data"], "a": 1, "e": "It starts with the problem and ends with the decision it can support."}, {"q": "Which sentence is a good opening for your presentation?", "o": ["I used Power BI and it has many features.", "First, let me show you my 14 cleaning steps.", "The sales manager must decide how much stock to order before September.", "This is my dashboard."], "a": 2, "e": "Start with who decides what. The tools come later."}, {"q": "A classmate asks, “So what?” What do they want?", "o": ["A longer list of metrics", "What someone should do differently because of your finding", "The file size", "The color palette"], "a": 1, "e": "A finding matters when it changes a decision."}, {"q": "Why should you state a limitation of your data?", "o": ["It weakens your work", "The rubric forbids it", "It makes your recommendation more credible", "Only to fill time"], "a": 2, "e": "A demanding audience will find it anyway. Saying it first builds trust."}, {"q": "Good peer feedback is:", "o": ["“I did not like it.”", "“The title says only the topic, so the manager does not know what to conclude. Try stating the peak.”", "“Your work is bad.”", "“Everything is great.”"], "a": 1, "e": "It says what you saw, why it matters and what you would try."}, {"q": "If you used AI in your project, the course asks you to:", "o": ["Hide it", "Declare the tool, its purpose, the prompts, the version and your own contribution", "Only mention it if asked", "Avoid checking the results"], "a": 1, "e": "The learning guide requires this declaration, and you remain responsible for the result."}], "sesion": 9};</script>
